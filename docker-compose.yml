services:
  iptv-api:
    image: guovern/iptv-api:latest
    container_name: iptv-api
    restart: unless-stopped
    tty: true
    stdin_open: true
    security_opt:
      - no-new-privileges:true

    ports:
      # Bind to 127.0.0.1 by default and terminate TLS in a reverse proxy; set
      # BIND_ADDR=0.0.0.0 only when the service must be exposed directly.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-80}:8080"

    volumes:
      - /iptv-api/config:/iptv-api/config
      - /iptv-api/output:/iptv-api/output

    environment:
      PUBLIC_SCHEME: "http"
      # Replace with your public domain or IP
      PUBLIC_DOMAIN: "127.0.0.1"
      PUBLIC_PORT: "${PORT:-80}"
      # Recommended: set a complete external URL, e.g. http://192.168.1.10
      # An unset/empty value keeps public_url from the mounted config.
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # Advanced compatibility setting; normally keep the container port unchanged
      NGINX_HTTP_PORT: "8080"
      CDN_URL: ""
      # Used only for subscription sources and EPG data, not media speed tests
      HTTP_PROXY: ""
